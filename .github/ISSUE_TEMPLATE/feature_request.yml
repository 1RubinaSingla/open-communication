name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you do today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
